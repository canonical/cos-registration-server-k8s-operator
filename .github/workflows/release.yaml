name: Release Charm to Edge and Publish Libraries

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - '**.md'
    branches:
      - main
      - track/**

jobs:
  release:
    permissions:
      actions: read
      contents: write
      issues: write
      security-events: write
    uses: canonical/observability/.github/workflows/charm-release.yaml@v2
    with:
      juju-channel: "3.6/stable"
    secrets:
      CHARMHUB_TOKEN: ${{ secrets.CHARMHUB_TOKEN }}

